<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件檢視專區存取須知｜TMSC</title>
<meta name="description" content="ISO 管理系統文件檢視專區僅供經授權之第三方稽核／驗證人員使用，如需取用文件請透過表單留言，將由專人立即回覆。">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --hero-bg:#0B1310;
  --green-900:#06331d;
  --green-800:#0b4d2c;
  --green-700:#0f6b3f;
  --green-600:#00A86B;
  --green-400:#48C7A5;
  --mint-bg:#F0F5F4;
  --ink:#182b1f;
  --muted:#5b7267;
  --border:#e1ebe3;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;
  background:var(--hero-bg);color:#fff;
  display:flex;align-items:center;justify-content:center;
  padding:32px 20px;line-height:1.9;
}
.shapes{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 14% 18%,rgba(0,168,107,.12) 0,rgba(0,168,107,.12) 160px,transparent 161px),
    radial-gradient(circle at 86% 84%,rgba(72,199,165,.09) 0,rgba(72,199,165,.09) 200px,transparent 201px);
}
.card{
  position:relative;z-index:1;width:100%;max-width:540px;text-align:center;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(72,199,165,.28);
  border-radius:20px;padding:48px 38px 40px;
  backdrop-filter:blur(6px);
}
.card img.brand{width:56px;margin:0 auto 20px;display:block;opacity:.95}
.card h1{margin:0 0 6px;font-size:1.28rem;font-weight:900;color:#fff;letter-spacing:.5px}
.card .sub{margin:0 0 30px;font-size:.82rem;color:var(--green-400);letter-spacing:1px}
.card p{margin:0 0 16px;font-size:.92rem;color:#c9d6d0;text-align:left}
.card p:last-of-type{margin-bottom:0}
.btn-row{margin-top:30px}
.btn{
  display:inline-block;width:100%;padding:15px 20px;border-radius:10px;
  background:var(--green-400);color:#06251c;font-weight:700;font-size:.98rem;
  text-decoration:none;font-family:inherit;transition:background .2s,transform .2s;
}
.btn:hover{background:#3eb092;transform:translateY(-2px)}
.back{
  display:inline-block;margin-top:22px;font-size:.8rem;color:#7e918c;text-decoration:none;
}
.back:hover{color:var(--green-400)}
.foot{
  margin-top:26px;padding-top:20px;border-top:1px solid rgba(72,199,165,.18);
  font-size:.72rem;color:#5d6f6a;line-height:1.85;
}
@media(max-width:480px){
  .card{padding:36px 24px 32px}
  .card h1{font-size:1.12rem}
}
</style>
</head>
<body>
<div class="shapes" aria-hidden="true"></div>
<div class="card">
  <img src="/images/logo.png" alt="TMSC" class="brand">
  <h1>ISO 管理系統文件檢視專區</h1>
  <p class="sub">Taiwan Management System Certificate Co., Ltd.</p>

  <p>本專區之系統文件僅提供予稽核期間經授權之第三方稽核／驗證人員檢視使用，目前未開放公開瀏覽入口。</p>
  <p>若您是稽核當期之稽核員，或因其他業務需要取用文件，請透過下方表單留言，我們將由專人立即回覆並安排存取方式。</p>

  <div class="btn-row">
    <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLScma-JAfeeo4W1-xMDcDHfVcwubSalbo4HDBIuGFhpXclg4SQ/viewform" target="_blank" rel="noopener">線上留言，專人立即回覆</a>
  </div>

  <a class="back" href="/">&larr; 返回 TMSC 官方網站首頁</a>

  <div class="foot">
    台灣管理系統驗證有限公司 TMSC　|　www.14064.com.tw
  </div>
</div>
</body>
</html>
